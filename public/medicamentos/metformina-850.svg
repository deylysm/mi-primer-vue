  </defs>
  <rect width="400" height="400" rx="48" fill="#e0f4f4"/>
  <ellipse cx="195" cy="338" rx="150" ry="14" fill="#000" opacity=".14"/>
  <g stroke="#0b4d4d" stroke-width="3" stroke-linejoin="round">
