<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <title>Frasco amarillo de complejo multivitamínico para adultos 50+, 120 tabletas recubiertas, con tabletas al lado</title>
  <rect width="400" height="400" rx="48" fill="#fff6cc"/>
  <ellipse cx="195" cy="342" rx="150" ry="13" fill="#000" opacity=".14"/>
  <!-- Frasco ancho con tapa -->
  <rect x="90" y="108" width="200" height="224" rx="32" fill="#f2b705" stroke="#5c4a00" stroke-width="3"/>
  <rect x="106" y="132" width="10" height="160" rx="5" fill="#fff" opacity=".35"/>
  <rect x="90" y="150" width="200" height="146" fill="#fff" stroke="#5c4a00" stroke-width="2.5"/>
  <rect x="110" y="58" width="160" height="58" rx="12" fill="#5c4a00" stroke="#5c4a00" stroke-width="3"/>
  <path d="M130 68V106M150 68V106M170 68V106M190 68V106M210 68V106M230 68V106M250 68V106" stroke="#fff0b0" stroke-width="3" stroke-linecap="round" opacity=".4"/>
  <rect x="140" y="236" width="100" height="32" rx="16" fill="#fff0b0" stroke="#f2b705" stroke-width="2"/>
  <!-- Estrella (suplemento) -->
  <path d="M190 164l4.5 9.5 10.5 1.3-7.7 7.2 2 10.3-9.3-5.1-9.3 5.1 2-10.3-7.7-7.2 10.5-1.3z" fill="#f2b705" stroke="#5c4a00" stroke-width="2" stroke-linejoin="round"/>
  <g font-family="system-ui, Arial, sans-serif" font-weight="700" text-anchor="middle">
    <text x="190" y="224" font-size="24" fill="#5c4a00">Multivitamínico</text>
    <text x="190" y="259" font-size="17" fill="#5c4a00">Adultos 50+</text>
    <text x="190" y="316" font-size="18" fill="#5c4a00">120 tabletas</text>
  </g>
  <!-- Tabletas recubiertas al lado -->
  <g fill="#ffd54a" stroke="#5c4a00" stroke-width="2.5">
    <ellipse cx="332" cy="312" rx="22" ry="12" transform="rotate(-15 332 312)"/>
    <ellipse cx="342" cy="282" rx="22" ry="12" transform="rotate(20 342 282)"/>
    <ellipse cx="320" cy="334" rx="22" ry="12" transform="rotate(8 320 334)"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M322 308q6 -5 12 -4"/><path d="M332 278q6 -4 12 -2"/></g>
