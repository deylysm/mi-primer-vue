<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <title>Caja rosada de Losartán 50 mg, 30 tabletas, con receta (Rx) y una lámina de tabletas ovaladas rosadas</title>
  <defs>
    <g id="pastilla"><ellipse rx="16" ry="9.5" fill="#f4a9c3" stroke="#8a1745" stroke-width="2.5"/><path d="M-9 -2a10 6 0 0 1 8 -4" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></g>
  </defs>
  <rect width="400" height="400" rx="48" fill="#fde6ee"/>
  <ellipse cx="195" cy="338" rx="150" ry="14" fill="#000" opacity=".14"/>
  <g stroke="#8a1745" stroke-width="3" stroke-linejoin="round">
    <polygon points="260,120 305,98 305,298 260,320" fill="#d6336c"/>
    <polygon points="70,120 115,98 305,98 260,120" fill="#f4a9c3"/>
    <rect x="70" y="120" width="190" height="200" fill="#d6336c"/>
  </g>
  <polygon points="260,280 305,258 305,298 260,320" fill="#f4a9c3"/>
  <polygon points="260,120 305,98 305,298 260,320" fill="#000" opacity=".22"/>
  <rect x="70" y="280" width="190" height="40" fill="#f4a9c3"/>
  <rect x="70" y="120" width="190" height="200" fill="none" stroke="#8a1745" stroke-width="3" stroke-linejoin="round"/>
  <path d="M70 280H260M260 280L305 258" fill="none" stroke="#8a1745" stroke-width="2.5"/>
  <rect x="82" y="152" width="166" height="110" rx="14" fill="#fff" stroke="#8a1745" stroke-width="2.5"/>
  <!-- Emblema: latido (electrocardiograma) -->
  <path transform="translate(104 136) scale(.8)" d="M-18 2h9l5 -13l8 25l5 -12h9" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="115" y="206" width="100" height="32" rx="16" fill="#f4a9c3"/>
  <g font-family="system-ui, Arial, sans-serif" font-weight="700" text-anchor="middle">
    <circle cx="232" cy="136" r="15" fill="#fff" stroke="#8a1745" stroke-width="2.5"/>
    <text x="232" y="142" font-size="16" fill="#8a1745">Rx</text>
    <text x="165" y="191" font-size="28" fill="#8a1745">Losartán</text>
    <text x="165" y="229" font-size="20" fill="#8a1745">50 mg</text>
    <text x="165" y="306" font-size="18" fill="#8a1745">30 tabletas</text>
  </g>
  <g transform="translate(238 250) rotate(-12)">
