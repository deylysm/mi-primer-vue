<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <title>Caja naranja de Ibuprofeno 400 mg, 20 tabletas, con una lámina de tabletas blancas</title>
  <defs>
    <g id="pastilla"><circle r="13" fill="#fff" stroke="#6b3a00" stroke-width="2.5"/><path d="M-6 -4a7 7 0 0 1 5 -5" fill="none" stroke="#ffd58a" stroke-width="2.5" stroke-linecap="round"/></g>
  </defs>
  <rect width="400" height="400" rx="48" fill="#fff1d6"/>
  <ellipse cx="195" cy="338" rx="150" ry="14" fill="#000" opacity=".14"/>
  <!-- Caja en 3/4: lado, tapa y frente -->
  <g stroke="#6b3a00" stroke-width="3" stroke-linejoin="round">
    <polygon points="260,120 305,98 305,298 260,320" fill="#e8890c"/>
    <polygon points="70,120 115,98 305,98 260,120" fill="#ffd58a"/>
    <rect x="70" y="120" width="190" height="200" fill="#e8890c"/>
  </g>
  <polygon points="260,170 305,148 305,250 260,272" fill="#fff"/>
  <polygon points="260,272 305,250 305,298 260,320" fill="#6b3a00"/>
  <polygon points="260,120 305,98 305,298 260,320" fill="#000" opacity=".22"/>
  <rect x="70" y="170" width="190" height="102" fill="#fff"/>
  <rect x="70" y="272" width="190" height="48" fill="#6b3a00"/>
  <rect x="70" y="120" width="190" height="200" fill="none" stroke="#6b3a00" stroke-width="3" stroke-linejoin="round"/>
  <path d="M70 170H260M70 272H260" stroke="#6b3a00" stroke-width="2.5"/>
  <!-- Emblema: llama -->
  <path transform="translate(104 145)" d="M0 -17C4 -8 14 -5 14 5a14 14 0 0 1 -28 0c0 -6 4 -9 6 -12 1 4 3 6 5 6 0 -6 -2 -10 3 -17z" fill="#fff"/>
  <rect x="115" y="222" width="100" height="32" rx="16" fill="#ffd58a"/>
  <g font-family="system-ui, Arial, sans-serif" font-weight="700" text-anchor="middle">
    <text x="165" y="208" font-size="26" fill="#6b3a00">Ibuprofeno</text>
    <text x="165" y="245" font-size="22" fill="#6b3a00">400 mg</text>
    <text x="165" y="303" font-size="20" fill="#fff">20 tabletas</text>
  </g>
  <!-- Lámina de tabletas apoyada delante -->
  <g transform="translate(238 250) rotate(-12)">
    <rect width="120" height="76" rx="9" fill="#dfe5ea" stroke="#6b3a00" stroke-width="3"/>
    <use href="#pastilla" x="24" y="22"/><use href="#pastilla" x="60" y="22"/><use href="#pastilla" x="96" y="22"/>
    <use href="#pastilla" x="24" y="52"/><use href="#pastilla" x="60" y="52"/><use href="#pastilla" x="96" y="52"/>
  </g>
</svg>
