  </defs>
  <rect width="400" height="400" rx="48" fill="#e3effa"/>
  <ellipse cx="195" cy="338" rx="150" ry="14" fill="#000" opacity=".14"/>
  <g stroke="#0a3d73" stroke-width="3" stroke-linejoin="round">
