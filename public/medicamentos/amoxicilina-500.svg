  <rect x="70" y="120" width="190" height="200" fill="none" stroke="#0a3d73" stroke-width="3" stroke-linejoin="round"/>
  <path d="M70 280H260M260 280L305 258" fill="none" stroke="#0a3d73" stroke-width="2.5"/>
  <rect x="82" y="152" width="166" height="110" rx="14" fill="#fff" stroke="#0a3d73" stroke-width="2.5"/>
