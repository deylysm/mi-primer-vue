<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <title>Caja azul de Amoxicilina 500 mg, 21 cápsulas, con receta (Rx) y una lámina de cápsulas azul y blanco</title>
  <defs>
