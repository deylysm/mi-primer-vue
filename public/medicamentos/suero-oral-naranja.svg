<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <title>Sobre celeste de suero de rehidratación oral sabor naranja, 27.9 g, con una rodaja de naranja</title>
  <rect width="400" height="400" rx="48" fill="#dff3fb"/>
  <ellipse cx="195" cy="342" rx="140" ry="12" fill="#000" opacity=".14"/>
  <!-- Sobre (sachet) con bordes dentados arriba y abajo -->
  <g transform="rotate(-4 200 200)">
    <path d="M100 80l10 -10l10 10l10 -10l10 10l10 -10l10 10l10 -10l10 10l10 -10l10 10l10 -10l10 10l10 -10l10 10l10 -10l10 10l10 -10l10 10l10 -10l10 10V312l-10 10l-10 -10l-10 10l-10 -10l-10 10l-10 -10l-10 10l-10 -10l-10 10l-10 -10l-10 10l-10 -10l-10 10l-10 -10l-10 10l-10 -10l-10 10l-10 -10l-10 10l-10 -10z" fill="#1aa0d0" stroke="#05506b" stroke-width="3" stroke-linejoin="round"/>
    <rect x="112" y="98" width="10" height="200" rx="5" fill="#fff" opacity=".3"/>
    <rect x="116" y="130" width="168" height="140" rx="12" fill="#fff" stroke="#05506b" stroke-width="2.5"/>
    <rect x="150" y="224" width="100" height="30" rx="15" fill="#a6dcf1"/>
    <g font-family="system-ui, Arial, sans-serif" font-weight="700" text-anchor="middle">
      <text x="200" y="170" font-size="28" fill="#05506b">Suero oral</text>
      <text x="200" y="201" font-size="19" fill="#05506b">sabor naranja</text>
      <text x="200" y="246" font-size="20" fill="#05506b">27.9 g</text>
    </g>
  </g>
  <!-- Rodaja de naranja -->
  <g transform="translate(305 300)">
    <circle r="46" fill="#f08a1c" stroke="#05506b" stroke-width="3"/>
    <circle r="38" fill="#ffc15e"/>
    <path d="M-38 0H38M0 -38V38M-27 -27L27 27M-27 27L27 -27" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle r="5" fill="#fff"/>
  </g>
  <!-- Gota de agua -->
  <path d="M60 96C60 96 46 114 46 122a14 14 0 0 0 28 0C74 114 60 96 60 96z" fill="#a6dcf1" stroke="#05506b" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
