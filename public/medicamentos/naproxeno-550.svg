  </defs>
  <rect width="400" height="400" rx="48" fill="#fff1d6"/>
  <ellipse cx="195" cy="338" rx="150" ry="14" fill="#000" opacity=".14"/>
  <g stroke="#6b3a00" stroke-width="3" stroke-linejoin="round">
